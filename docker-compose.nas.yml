# mcp-basic-memory - serwer MCP basic-memory (streamable-http, /mcp). Stack Portainera "mcp-basic-memory" (id 18).
# Obraz budowany z forka elconcept/mcp-basic-memory (ten katalog = checkout). Pliki NAS: docker-compose.nas.yml,
# nas/sitecustomize.py, Dockerfile.dockerignore. Notatki w knowledge/ (poza gitem i poza obrazem).
# Port na hoscie 8401 (LAN, bez autoryzacji: http://10.0.10.201:8401/mcp). Z internetu: https://basic-memory.xlap.pl/mcp - tunel cloudflared + Access
# (Managed OAuth); siec cf_mcp_basic_memory = cloudflared + ten kontener (+ uprzywilejowany Holyclaude).
services:
  mcp-basic-memory:
    build:
      context: /volume2/docker/basic-memory
      dockerfile: Dockerfile
      # appuser = uid procesu, wiec /home/appuser (cache HF/xet, ~/.cache) jest zapisywalny.
      # Upstream ma domyslnie 1000:1000, a kontener chodzil jako 1026 -> "Permission denied" przy pobieraniu modelu.
      args: {UID: "1026", GID: "100"}
    image: mcp-basic-memory:latest
    container_name: mcp-basic-memory
    # uid NAS "eviltwin" - pliki notatek sa edytowalne z Holyclaude.
    user: "1026:100"
    volumes:
      - basic-memory-config:/home/appuser/.basic-memory:rw
      - /volume2/docker/basic-memory/knowledge:/app/data:rw
    environment:
      - HOME=/home/appuser
      # Cache HF (w tym xet) na trwalym wolumenie - niezaleznie od praw do ~/.cache.
      - HF_HOME=/home/appuser/.basic-memory/hf
      - BASIC_MEMORY_DEFAULT_PROJECT=main
      - BASIC_MEMORY_SYNC_CHANGES=true
      - BASIC_MEMORY_LOG_LEVEL=INFO
      - BASIC_MEMORY_SYNC_DELAY=1000
      # Shared local E5 large: one model process for all NAS applications.
      - BASIC_MEMORY_SEMANTIC_SEARCH_ENABLED=true
      - BASIC_MEMORY_SEMANTIC_EMBEDDING_PROVIDER=openai
      - BASIC_MEMORY_SEMANTIC_EMBEDDING_MODEL=intfloat/multilingual-e5-large
      - BASIC_MEMORY_SEMANTIC_EMBEDDING_DIMENSIONS=1024
      - "BASIC_MEMORY_SEMANTIC_EMBEDDING_DOCUMENT_PREFIX=passage: "
      - "BASIC_MEMORY_SEMANTIC_EMBEDDING_QUERY_PREFIX=query: "
      - BASIC_MEMORY_SEMANTIC_EMBEDDING_API_BASE=http://shared-e5-large:8080/v1
      - BASIC_MEMORY_SEMANTIC_EMBEDDING_API_KEY=${EMBEDDER_API_KEY}
      - BASIC_MEMORY_SEMANTIC_EMBEDDING_BATCH_SIZE=1
      - BASIC_MEMORY_SEMANTIC_EMBEDDING_REQUEST_CONCURRENCY=1
      - TZ=Europe/Warsaw
    ports: ["8401:8000"]
    networks: [cf_mcp_basic_memory, embeddings]
    command: ["basic-memory", "mcp", "--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped

volumes:
  # Wolumen z czasow stacka "basic-memory" - zachowana nazwa.
  basic-memory-config:
    external: true
    name: basic-memory_basic-memory-config

networks:
  cf_mcp_basic_memory: {external: true}

  embeddings: {external: true, name: shared_embeddings}
